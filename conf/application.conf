# https://www.playframework.com/documentation/latest/Configuration

play.http.errorHandler = "config.ErrorHandler"
play.http.secret.key = ${?APP_SECRET}
http.port = 9245
play.http.session.secure = false
play.http.session.secure = ${?IS_SESSION_SECURE}

play.i18n.langs = [ "en" ]

allowedHost = "localhost:"${http.port}
allowedHost = ${?PLAY_FILTERS_HOSTS}
protocol = "http://"
protocol = ${?PROTOCOL}
appName = "centralHeatingCommand"

play.filters.enabled += "filters.SessionFilter"
play.filters.enabled += "filters.RequestAttrFilter"

play.filters.hosts {
  allowed = [${allowedHost}]
}
play.filters.headers {
  frameOptions = "SAMEORIGIN"
}

play.modules.enabled += "config.AppModules"

play.server.pidfile.path=/dev/null

database.name=central_heating
db {
  default {
    driver=org.mariadb.jdbc.Driver
    url="jdbc:mariadb://localhost:3306/"${database.name}"?createDatabaseIfNotExist=true" # trufflehog:ignore
    url=${?DB_URL}
    username=root
    username=${?DB_USER}
    password=example
    password=${?DB_PASSWORD}
    logSql=true
  }
}

db-options {
  cache-queries {
    ttlInMinutes = 5
    ttlInMinutes = ${?DB_CACHE_QUERIES_TTL}
  }
}

database.dispatcher {
  thread-pool-executor {
    core-pool-size-factor = 10.0
    core-pool-size-max = 10
  }
}

microservice {
  services {
    nest {
      api-host = "https://smartdevicemanagement.googleapis.com"
      google-token-host = "https://oauth2.googleapis.com"
      auth-host = "https://nestservices.google.com"

      client-id = ${?NEST_CLIENT_ID}
      client-secret = ${?NEST_CLIENT_SECRET}
      project-id = ${?NEST_PROJECT_ID}
      device-id = ${?NEST_DEVICE_ID}
      redirect-uri = "http://localhost:9245/admin/nest/oauth/callback"
      redirect-uri = ${?NEST_REDIRECT_URI}
    }

    graphite {
      host = "localhost"
      host = ${?GRAPHITE_HOST}
      port = 2003
      port = ${?GRAPHITE_PORT}
      prefix = "home-test.heating.nest"
      prefix = ${?GRAPHITE_PREFIX}
      connect-timeout-ms = 2000
      read-timeout-ms = 2000
    }

    mqtt {
      isEnabled = false
      isEnabled = ${?MQTT_IS_ENABLED}
      broker-url = "tcp://192.168.1.2:1883"
      broker-url = ${?MQTT_BROKER_URL}
      client-id = "heating"
      trv-devices = "zigbee2mqtt/bedroom-garage-trv"
      trv-devices = ${?MQTT_TRV_DEVICES}
      temperature-devices = "zigbee2mqtt/living-room-sensor1"
      temperature-devices = ${?MQTT_TEMPERATURE_DEVICES}
    }
  }
}


scheduler {
  nest {
    isEnabled = false
    isEnabled = ${?NEST_SCHEDULER_IS_ENABLED}
    startDelayInSeconds = 20
    startDelayInSeconds = ${?NEST_SCHEDULER_START_DELAY_IN_SECONDS}
    intervalInSeconds = 120
    intervalInSeconds = ${?NEST_SCHEDULER_INTERVAL_IN_SECONDS}
    timeoutInSeconds= 10
    timeoutInSeconds= ${?NEST_SCHEDULER_TIMEOUT_IN_SECONDS}
  }
}

heating-demand {
  isEnabled = false
  isEnabled= ${?HEATING_DEMAND_IS_ENABLED}
  sensorControlIsEnabled = false
  sensorControlIsEnabled = ${?HEATING_SENSOR_CONTROL_IS_ENABLED}
  trvControlIsEnabled = false
  trvControlIsEnabled = ${?HEATING_TRV_CONTROL_IS_ENABLED}

  active-temperature-celsius = 21.0
  active-temperature-celsius = ${?HEATING_DEMAND_ACTIVE_TEMPERATURE_CELSIUS}

  standby-temperature-celsius = 16.0
  standby-temperature-celsius = ${?HEATING_DEMAND_STANDBY_TEMPERATURE_CELSIUS}
  
  offset = 0.1
  offset = ${?HEATING_DEMAND_OFFSET}
}

sensor-schedules {
  "zigbee2mqtt/living-room-sensor1" {
    periods = [
      {
        start = "06:00"
        end = "22:00"
        temperature = 20.5
      }
    ]
  }
}